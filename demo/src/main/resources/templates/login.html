<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="_csrf" th:content="${_csrf.token}"><meta name="_csrf_header" th:content="${_csrf.headerName}"><title>Sign in · Registration Lab</title><link rel="stylesheet" href="/css/style.css"></head><body><main><p>Java · Spring Security · JPA</p><h1>Sign in</h1><p th:if="${param.error}" role="alert">Incorrect username or password.</p><p th:if="${param.logout}">You have signed out.</p><form th:action="@{/req/login}" method="post"><label>Username <input name="username" required autocomplete="username"></label><label>Password <input name="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form><a href="/req/signup">Create an account</a><small>Local learning demo. Use fictional details.</small></main></body></html>
